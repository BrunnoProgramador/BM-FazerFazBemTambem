# =============================================================
# Compose de PRODUÇÃO (VM Oracle ou similar)
# Uso, a partir da pasta deploy/ com o .env preenchido:
#   docker compose -f docker-compose.producao.yml up -d --build
#
# Decisões de segurança (não relaxar):
# - Porta do Firebird só em 127.0.0.1 → acesso externo apenas por túnel SSH
# - Web nunca exposto direto: só o Caddy publica 80/443 (HTTPS automático)
# - Senha vem do .env (fora do git)
# =============================================================

services:
  firebird:
    image: jacobalberty/firebird:v5
    environment:
      ISC_PASSWORD: ${FB_PASSWORD}
      FIREBIRD_DATABASE: projetoem.fdb
    volumes:
      - ./dados:/firebird/data
      - ./backups:/firebird/backups
    ports:
      - "127.0.0.1:3055:3050"   # loopback apenas — NUNCA 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/3050' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..                                # raiz do repositório
      dockerfile: ProjetoAtual/EM.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Nome tem que ser "Firebird" — é o que o Program.cs lê
      ConnectionStrings__Firebird: "DataSource=firebird;Port=3050;Database=/firebird/data/projetoem.fdb;User=SYSDBA;Password=${FB_PASSWORD};Charset=UTF8"
    depends_on:
      firebird:
        condition: service_healthy               # espera o banco aceitar conexão
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_dados:
  caddy_config:
