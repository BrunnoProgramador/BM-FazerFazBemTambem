services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=projetoem;Username=postgres;Password=postgres
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projetoem
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
